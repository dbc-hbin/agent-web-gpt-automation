<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Agent Web GPT Automation</title>
  <desc id="desc">Isometric Mobius prism loop representing seamless agent web delegation.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Facet 1: Cyan to Emerald -->
    <linearGradient id="facetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- Facet 2: Violet to Deep Purple -->
    <linearGradient id="facetPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <!-- Facet 3: Electric Magenta / Coral Accent -->
    <linearGradient id="facetPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <!-- Inner Glow Filter -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E293B" stroke-width="2.5" opacity="0.8"/>

  <!-- Ambient Backdrop Light -->
  <circle cx="256" cy="256" r="140" fill="#2DD4BF" opacity="0.08" filter="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="110" fill="#7C3AED" opacity="0.12" filter="url(#coreGlow)"/>

  <!-- Isometric Mobius Ribbon Segments -->
  <!-- Top Segment (Sweeping from top-left to top-right down) -->
  <path d="M 256,92 
           C 340,92 412,154 412,238 
           C 412,284 388,324 352,348 
           L 308,304 
           C 330,288 344,264 344,238 
           C 344,188 304,152 256,152 
           C 214,152 178,180 170,220 
           L 102,204 
           C 118,138 180,92 256,92 Z" 
        fill="url(#facetCyan)"/>

  <!-- Bottom Segment (Sweeping from bottom-right to bottom-left up) -->
  <path d="M 256,420 
           C 172,420 100,358 100,274 
           C 100,228 124,188 160,164 
           L 204,208 
           C 182,224 168,248 168,274 
           C 168,324 208,360 256,360 
           C 298,360 334,332 342,292 
           L 410,308 
           C 394,374 332,420 256,420 Z" 
        fill="url(#facetPurple)"/>

  <!-- Crossing Bridge Overlap / Energy Connector -->
  <path d="M 204,208 L 256,256 L 224,288 L 172,236 Z" fill="#6366F1" opacity="0.9"/>
  <path d="M 308,304 L 256,256 L 288,224 L 340,276 Z" fill="#2DD4BF" opacity="0.9"/>

  <!-- Central Suspended Quantum Spark -->
  <polygon points="256,218 288,256 256,294 224,256" fill="#FFFFFF" filter="url(#coreGlow)"/>
  <polygon points="256,230 278,256 256,282 234,256" fill="#F8FAFC"/>
  <circle cx="256" cy="256" r="6" fill="#38BDF8"/>
</svg>
