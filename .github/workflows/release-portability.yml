name: release-portability
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: node dist/index.js --help
      - run: npm pack --dry-run
